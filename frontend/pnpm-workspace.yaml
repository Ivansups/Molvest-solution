overrides:
  # GHSA / Dependabot #3: stack exhaustion merging recursive object graphs.
  deepmerge-ts: '>=8.0.0'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
