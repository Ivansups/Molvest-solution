overrides:
  # GHSA / Dependabot #3: stack exhaustion merging recursive object graphs.
  deepmerge-ts: '>=8.0.0'
  # GHSA / Dependabot #1: AsyncLocalStorage context lost/contaminated inside
  # Effect fibers under concurrent load with RPC.
  effect: '>=3.20.0'
  # GHSA / Dependabot #2: record() issue paths can make flatten() throw for
  # inherited Object property names.
  valibot: '>=1.4.2'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
