name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-server:
    name: Lint backend (ruff/mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy .

  lint-frontend:
    name: Lint frontend (eslint/tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  build-frontend:
    name: Build frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**') }}
          restore-keys: next-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build

  test-server:
    name: Test backend (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/molvest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        # live LLM (маркер live) — только локально через make test-live
        run: uv run pytest -m "not live"

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  build:
    name: Build Docker images (api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t molvest-api ./server
      - name: Build web image
        run: docker build -t molvest-web ./frontend

  outdated-deps:
    name: Check outdated dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install server deps
        working-directory: server
        run: uv sync --all-groups
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Collect outdated packages
        id: check
        run: |
          {
            echo "### Backend (uv)"
            echo '```'
            (cd server && uv pip list --outdated) | tee /tmp/server-outdated.txt || true
            echo '```'
            echo
            echo "### Frontend (pnpm)"
            echo '```'
            (cd frontend && pnpm outdated) | tee /tmp/frontend-outdated.txt || true
            echo '```'
          } > /tmp/outdated-body.md

          if [ -s /tmp/server-outdated.txt ] || [ -s /tmp/frontend-outdated.txt ]; then
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_outdated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HAS_OUTDATED: ${{ steps.check.outputs.has_outdated }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TITLE="📦 Outdated dependencies"
          ISSUE_NUMBER=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number")

          if [ "$HAS_OUTDATED" = "true" ]; then
            {
              echo "Обнаружено CI на PR #${PR_NUMBER} (\`${PR_SHA}\`)."
              echo
              cat /tmp/outdated-body.md
            } > /tmp/issue-body.md

            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/issue-body.md
            else
              gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/issue-body.md
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" \
              --comment "Все зависимости актуальны на \`${PR_SHA}\` — закрываю."
          fi

  notify:
    name: Telegram alert
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action == 'opened')
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # На PR из форка секреты недоступны — молча выходим, а не роняем джобу.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets недоступны (PR из форка?) — уведомление пропущено."
            exit 0
          fi

          escape_md() {
            sed -e 's/[_*`\[]/\\&/g'
          }

          REPO_E=$(printf '%s' "$REPO" | escape_md)
          ACTOR_E=$(printf '%s' "$ACTOR" | escape_md)
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE_E=$(printf '%s' "$PR_TITLE" | escape_md)
            HEAD_E=$(printf '%s' "$PR_HEAD" | escape_md)
            BASE_E=$(printf '%s' "$PR_BASE" | escape_md)
            TEXT=$(cat <<EOF
          🔀 *Новый PR в ${REPO_E}*
          #${PR_NUMBER}: ${TITLE_E}
          Ветки: \`${HEAD_E}\` → \`${BASE_E}\`
          Автор: ${ACTOR_E}
          PR: ${PR_URL}
          Run: ${RUN_URL}
          EOF
            )
          else
            SHORT_SHA="${COMMIT_SHA:0:7}"
            FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
            BRANCH_E=$(printf '%s' "$BRANCH" | escape_md)
            MSG_E=$(printf '%s' "$FIRST_LINE" | escape_md)
            TEXT=$(cat <<EOF
          🔔 *Push in ${REPO_E}*
          Branch: \`${BRANCH_E}\`
          Author: ${ACTOR_E}
          Commit: \`${SHORT_SHA}\` — ${MSG_E}
          Run: ${RUN_URL}
          EOF
            )
          fi

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${TEXT}"
