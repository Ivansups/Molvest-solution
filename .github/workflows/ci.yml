name: CI

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Telegram alert
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          escape_md() {
            sed -e 's/[_*`\[]/\\&/g'
          }

          SHORT_SHA="${COMMIT_SHA:0:7}"
          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"

          REPO_E=$(printf '%s' "$REPO" | escape_md)
          BRANCH_E=$(printf '%s' "$BRANCH" | escape_md)
          ACTOR_E=$(printf '%s' "$ACTOR" | escape_md)
          MSG_E=$(printf '%s' "$FIRST_LINE" | escape_md)

          TEXT=$(cat <<EOF
          🔔 *Push in ${REPO_E}*
          Branch: \`${BRANCH_E}\`
          Author: ${ACTOR_E}
          Commit: \`${SHORT_SHA}\` — ${MSG_E}
          Run: https://github.com/${REPO}/actions/runs/${RUN_ID}
          EOF
          )

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${TEXT}"
