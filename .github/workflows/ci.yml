name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-server:
    name: Lint backend (ruff/mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy .

  lint-frontend:
    name: Lint frontend (eslint/tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # frontend/Dockerfile монтирует исходники в рантайме и не запускает next build,
  # поэтому сборку фронта проверяем отдельной джобой — параллельно линту, а не после него.
  build-frontend:
    name: Build frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**') }}
          restore-keys: next-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build

  test-server:
    name: Test backend (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/molvest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  build:
    name: Build Docker images (api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t molvest-api ./server
      - name: Build web image
        run: docker build -t molvest-web ./frontend

  notify:
    name: Telegram alert
    runs-on: ubuntu-latest
    # Шумят только два события: открытие PR и пуш в main. Промежуточные
    # пуши в ветку с открытым PR молчат — их видно в самом PR.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action == 'opened')
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # На PR из форка секреты недоступны — молча выходим, а не роняем джобу.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets недоступны (PR из форка?) — уведомление пропущено."
            exit 0
          fi

          escape_md() {
            sed -e 's/[_*`\[]/\\&/g'
          }

          REPO_E=$(printf '%s' "$REPO" | escape_md)
          ACTOR_E=$(printf '%s' "$ACTOR" | escape_md)
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE_E=$(printf '%s' "$PR_TITLE" | escape_md)
            HEAD_E=$(printf '%s' "$PR_HEAD" | escape_md)
            BASE_E=$(printf '%s' "$PR_BASE" | escape_md)
            TEXT=$(cat <<EOF
          🔀 *Новый PR в ${REPO_E}*
          #${PR_NUMBER}: ${TITLE_E}
          Ветки: \`${HEAD_E}\` → \`${BASE_E}\`
          Автор: ${ACTOR_E}
          PR: ${PR_URL}
          Run: ${RUN_URL}
          EOF
            )
          else
            SHORT_SHA="${COMMIT_SHA:0:7}"
            FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
            BRANCH_E=$(printf '%s' "$BRANCH" | escape_md)
            MSG_E=$(printf '%s' "$FIRST_LINE" | escape_md)
            TEXT=$(cat <<EOF
          🔔 *Push in ${REPO_E}*
          Branch: \`${BRANCH_E}\`
          Author: ${ACTOR_E}
          Commit: \`${SHORT_SHA}\` — ${MSG_E}
          Run: ${RUN_URL}
          EOF
            )
          fi

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${TEXT}"
